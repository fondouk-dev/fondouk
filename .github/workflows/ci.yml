name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  capability-core:
    name: capability-core tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        working-directory: capability-core
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests (schema + DTO + adapters vs published UCP schemas)
        working-directory: capability-core
        run: composer test
